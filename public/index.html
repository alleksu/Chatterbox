<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c12" />
    <title>Chatterbox</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/logo.svg" alt="" width="40" height="40" />
          <div class="brand-text">
            <span class="brand-name">Chatterbox</span>
            <span class="brand-tag">LAN messenger</span>
          </div>
        </div>

        <div class="status" id="status">Connecting…</div>

        <div class="section-head">
          <h2>Chats</h2>
          <button type="button" id="new-group" class="mini" title="Start a group chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            Group
          </button>
        </div>
        <ul class="channels" id="channels"></ul>

        <div class="sidebar-footer">
          <div class="me">You are <strong id="me-name">—</strong></div>
          <div class="sidebar-actions">
            <button type="button" id="change-name" class="ghost">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16v4Z" /></svg>
              Name
            </button>
            <button type="button" id="copy-link" class="ghost">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6M8 12l-2 2a3 3 0 0 0 4 4l2-2M16 12l2-2a3 3 0 0 0-4-4l-2 2" /></svg>
              Invite
            </button>
          </div>
        </div>
      </aside>

      <main class="chat">
        <header class="topbar">
          <button type="button" id="toggle-menu" class="icon" aria-label="Toggle chats sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="room">
            <div class="room-icon" id="room-icon">#</div>
            <div class="room-text">
              <div class="title" id="room-title">General</div>
              <div class="sub" id="subtitle">No messages yet</div>
            </div>
          </div>
          <div class="net-pill"><span class="live-dot"></span>LAN</div>
          <button type="button" id="toggle-members" class="icon" aria-label="Toggle online devices">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M17 11a3 3 0 1 0-2-5.2M21 19v-1a4 4 0 0 0-3-3.8" /></svg>
          </button>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <div class="input-shell">
            <textarea
              id="input"
              rows="1"
              placeholder="Message the room…"
              maxlength="2000"
              autocomplete="off"
              enterkeyhint="send"
            ></textarea>
            <button type="submit" id="send" class="send" aria-label="Send message">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-4 16-4-6-8-2Z" /></svg>
            </button>
          </div>
        </form>
      </main>

      <aside class="members-panel" id="members-panel">
        <div class="section-head">
          <h2>Online</h2>
          <span class="count" id="online-count">0</span>
        </div>
        <ul class="users" id="users"></ul>
      </aside>

      <button type="button" id="scrim" class="scrim" aria-label="Close panels" tabindex="-1"></button>
    </div>

    <div id="name-dialog" class="overlay" hidden>
      <form id="name-form" class="card">
        <img class="card-mark" src="/logo.svg" alt="" width="56" height="56" />
        <h1>Welcome to Chatterbox</h1>
        <p>Pick the name the other devices on this network will see.</p>
        <input id="name-input" maxlength="24" placeholder="Your name" autocomplete="nickname" required />
        <button type="submit">Start chatting</button>
      </form>
    </div>

    <div id="group-dialog" class="overlay" hidden>
      <form id="group-form" class="card">
        <h1>New group chat</h1>
        <p>Name the group and choose who joins it.</p>
        <input id="group-name" maxlength="40" placeholder="Group name" autocomplete="off" required />
        <ul id="group-members" class="member-list"></ul>
        <div class="form-error" id="group-error" hidden></div>
        <div class="card-actions">
          <button type="button" id="group-cancel" class="secondary">Cancel</button>
          <button type="submit">Create group</button>
        </div>
      </form>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
