<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <title>LAN Chat</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand"><span class="dot"></span> LAN Chat</div>
        <div class="status" id="status">Connecting…</div>

        <h2>Online <span id="online-count">0</span></h2>
        <ul class="users" id="users"></ul>

        <div class="sidebar-footer">
          <div class="me">You are <strong id="me-name">—</strong></div>
          <div class="sidebar-actions">
            <button type="button" id="change-name" class="ghost">Change name</button>
            <button type="button" id="copy-link" class="ghost">Copy link</button>
          </div>
        </div>
      </aside>

      <main class="chat">
        <header class="topbar">
          <button type="button" id="toggle-users" class="icon" aria-label="Toggle online users">☰</button>
          <div>
            <div class="title">Local room</div>
            <div class="sub" id="subtitle">No messages yet</div>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="composer" class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Message the room…"
            maxlength="2000"
            autocomplete="off"
            enterkeyhint="send"
          ></textarea>
          <button type="submit" id="send" class="send">Send</button>
        </form>
      </main>
    </div>

    <div id="name-dialog" class="overlay" hidden>
      <form id="name-form" class="card">
        <h1>Join the LAN chat</h1>
        <p>Pick the name the other devices on this network will see.</p>
        <input id="name-input" maxlength="24" placeholder="Your name" autocomplete="nickname" required />
        <button type="submit">Join</button>
      </form>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
